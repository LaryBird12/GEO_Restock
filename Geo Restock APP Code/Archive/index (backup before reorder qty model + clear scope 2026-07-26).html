<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GEO Restock">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">

<meta name="theme-color" content="#0f172a">
<title>GEO Restock</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation}
html,body{height:100%;background:#0f172a;overflow:hidden}
body{font-family:-apple-system,system-ui,sans-serif;color:#e2e8f0}
#app{height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.hdr{background:var(--team-hdr-bg,#1a2540);padding:13px 16px;border-bottom:2px solid var(--team-hdr-border,#2a3a5c);flex-shrink:0}
.hdr-row{display:flex;align-items:center;gap:8px}
.hdr-title{font-size:16px;font-weight:700;color:#e2e8f0}
.hdr-sub{font-size:11px;color:#4a5a7a;margin-top:1px}
.back{background:none;border:none;color:#38bdf8;font-size:28px;cursor:pointer;padding:0 6px 0 0;line-height:1;flex-shrink:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(80px,env(safe-area-inset-bottom))}
input{width:100%;padding:13px 14px;background:#1a2540;border:1px solid #2a3a5c;border-radius:10px;color:#e2e8f0;font-size:16px;outline:none;-webkit-appearance:none;display:block}
.btn{border:none;border-radius:10px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;width:100%;display:block;text-align:center}
.btn+.btn{margin-top:10px}
.blue{background:#38bdf8;color:#0f172a}
.green{background:#22c55e;color:#fff}
.ghost{background:#1a2540;color:#7a8fb5;border:1px solid #2a3a5c}
.sm{padding:8px 12px;font-size:13px;width:auto}
.offline-pill{position:fixed;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#7c2d12;color:#fed7aa;font-size:11px;font-weight:700;padding:4px 12px;border-radius:12px;z-index:900;display:none;border:1px solid rgba(251,146,60,.4)}
/* Team selection */
.team-screen{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;overflow-y:auto}
.group-hdr{font-size:15px;color:#7a8fb5;margin-bottom:26px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;}
    .team-grid{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.team-card{border:none;border-radius:18px;padding:20px 22px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:16px;width:100%;touch-action:manipulation}
.team-card-icon{font-size:34px;flex-shrink:0;width:46px;text-align:center;line-height:1}
.team-card-label{font-size:22px;font-weight:800;letter-spacing:.01em}
.team-card-sub{font-size:12px;opacity:.6;margin-top:3px;font-weight:500}
/* Nav cards */
.nav-card{border-radius:14px;padding:20px;width:100%;text-align:left;cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:12px;border:none}
.nav-card-title{font-size:17px;font-weight:700;color:#e2e8f0}
.nav-card-sub{font-size:12px;color:#7a8fb5;margin-top:3px}
.report-link{background:#1a2540;color:#38bdf8;border:1px solid #2a3a5c;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;width:100%;text-align:center;margin-bottom:12px;display:block}
/* Search */
.search-wrap{padding:8px 20px 4px}
.search-lbl{font-size:16px;font-weight:700;color:#7a8fb5;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.search-input-wrap{position:relative}
.search-input-wrap input{padding-right:44px}
.srch-clr{position:absolute;right:0;top:0;bottom:0;width:44px;background:none;border:none;color:#7a8fb5;font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center}
/* Categories */
/* Single-column compartment tiles (Mitch, go night): name left, count mid, logged right — one row */
.cat-grid{display:grid;grid-template-columns:1fr;gap:10px;padding:14px}
.cat-tile{background:#1a2540;border:1px solid #2a3a5c;border-radius:12px;padding:16px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:12px}
.cat-tile.has-use{background:#0d2a4a;border-color:rgba(56,189,248,.3)}
.ct-name{font-size:14px;font-weight:600;color:#e2e8f0;flex:1;min-width:0}
.ct-count{font-size:12px;color:#4a5a7a;flex-shrink:0}
.ct-used{font-size:12px;color:#38bdf8;font-weight:600;flex-shrink:0;min-width:64px;text-align:right}
/* Items */
.item-row{display:flex;align-items:center;padding:13px 16px;cursor:pointer;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid #101e35}
.item-row.used{background:#0d2038}
.item-name{font-size:14px;color:#7a8fb5;font-weight:400}
.item-row.used .item-name{color:#e2e8f0;font-weight:600}
.item-meta{font-size:11px;color:#2a3a5c;margin-top:1px}
.badge{background:rgba(239,68,68,.15);color:#ef4444;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:700;margin-right:4px}
.badge.flag{background:rgba(56,189,248,.15);color:#38bdf8}
.chevron{color:#2a3a5c;font-size:18px;flex-shrink:0;margin-left:6px}
.wh-count{padding:14px 20px 6px;font-size:13px;color:#7a8fb5;font-weight:600}
.wh-count b{color:#e2e8f0}
/* Assembly container (exploded view): green = hand-refill, amber = on order */
.asm-sec{padding:10px 2px 6px;font-size:11px;font-weight:800;letter-spacing:.06em}
.asm-sec-green{color:#22c55e}
.asm-sec-amber{color:#fbbf24}
.asm-row{display:flex;align-items:center;gap:10px;width:100%;background:#0f172a;border:1px solid #2a3a5c;border-radius:10px;padding:10px 12px;margin-bottom:8px;text-align:left;cursor:pointer;font-family:inherit}
.asm-row.done{border-color:#22c55e;background:#0c2a18}
.asm-row.static{cursor:default;border-color:#4a3a10;background:#1d1a0e}
.asm-row .box{width:22px;height:22px;border-radius:6px;border:2px solid #3a4a6c;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#0f172a}
.ar-name{font-size:13px;font-weight:600;color:#e2e8f0}
.ar-meta{font-size:11px;color:#7a8fb5;margin-top:1px}
/* Report */
.sec-hdr{padding:7px 16px;background:#101e35;font-size:11px;font-weight:700;color:#7a8fb5;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;z-index:1}
.rep-row{display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid #101e35;cursor:pointer;width:100%;background:transparent;border-left:none;border-right:none;border-top:none;text-align:left}
/* Popup / detail */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.popup{background:#1a2540;border-radius:16px;padding:22px;width:100%;max-width:330px;border:1px solid #2a3a5c;max-height:88vh;overflow-y:auto}
.pop-img{width:100%;height:170px;border-radius:12px;background:#0f172a;border:1px solid #2a3a5c;margin-bottom:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pop-img img{width:100%;height:100%;object-fit:contain}
.img-ph{color:#3a4a6c;font-size:13px;font-weight:600}
.pop-name{font-size:17px;font-weight:700;margin-bottom:4px;line-height:1.3}
.pop-meta{font-size:14px;color:#7a8fb5;margin-bottom:18px}
.pop-meta .hl{color:#e2e8f0;font-weight:600}
.pop-lbl{font-size:12px;color:#7a8fb5;font-weight:600;margin-bottom:8px}
.qty-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.qty-btn{width:50px;height:50px;border-radius:10px;border:none;font-size:26px;font-weight:700;cursor:pointer;flex-shrink:0}
.qty-minus{background:#ef4444;color:#fff}
.qty-minus.off{background:#2a3a5c;opacity:.3;cursor:default}
.qty-plus{background:#22c55e;color:#fff}
.qty-input{flex:1;text-align:center;font-size:26px;font-weight:700;padding:10px;background:#0f172a;border:1px solid #2a3a5c;border-radius:10px;color:#e2e8f0}
/* Checkbox controls */
.chk{display:flex;align-items:center;gap:12px;width:100%;background:#0f172a;border:1px solid #2a3a5c;border-radius:12px;padding:14px 16px;cursor:pointer;margin-bottom:12px;text-align:left}
.chk .box{width:26px;height:26px;border-radius:7px;border:2px solid #3a4a6c;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#0f172a}
.chk.on{border-color:#22c55e;background:#0c2a18}
.chk.on .box{background:#22c55e;border-color:#22c55e}
.chk .lbl{font-size:15px;font-weight:600;color:#e2e8f0}
.chk .lbl small{display:block;font-size:12px;font-weight:500;color:#7a8fb5;margin-top:2px}
.chk.big{flex-direction:column;align-items:stretch;gap:12px;padding:16px 16px 18px}
.chk.big .chk-top{display:flex;align-items:center;gap:12px;width:100%}
.chk.big .chk-qty{font-size:27px;font-weight:800;color:#e2e8f0;line-height:1.05;text-align:left}
.detail-stat{background:#0f172a;border:1px solid #2a3a5c;border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.detail-stat .k{font-size:12px;color:#7a8fb5;font-weight:600}
.detail-stat .v{font-size:18px;color:#e2e8f0;font-weight:700}
/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#166534;color:#bbf7d0;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:600;z-index:999;pointer-events:none;white-space:nowrap;display:none;border:1px solid rgba(34,197,94,.3)}
/* Sync status dot */
.sync-pill{width:15px;height:15px;min-width:15px;border-radius:50%;background:#22c55e;border:2px solid #0c2a18;padding:0;cursor:pointer;flex-shrink:0;box-shadow:0 0 7px rgba(34,197,94,.55)}
.sync-pill.pending{background:#ef4444;border-color:#3a0f0f;box-shadow:0 0 7px rgba(239,68,68,.65)}
.sync-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:flex-end;z-index:1000;padding:max(56px,calc(env(safe-area-inset-top) + 50px)) 12px 0}
.syncbox{background:#1a2540;border:1px solid #2a3a5c;border-radius:14px;padding:18px;width:258px;max-width:82vw;box-shadow:0 12px 44px rgba(0,0,0,.55)}
.syncrow{display:flex;align-items:flex-start;gap:12px}
.sdotbig{width:14px;height:14px;border-radius:50%;flex-shrink:0;margin-top:3px}
.sdotbig.g{background:#22c55e}.sdotbig.r{background:#ef4444}
.syncbox b{font-size:14px;color:#e2e8f0}
.syncsub{font-size:11px;color:#7a8fb5;margin-top:2px}
.syncdiv{height:1px;background:#2a3a5c;margin:14px 0}
.syncrow2{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#7a8fb5}
.syncrow2 b{font-size:17px;color:#38bdf8}
.syncoff{font-size:11px;color:#fed7aa;margin-top:12px;background:#7c2d12;border-radius:8px;padding:7px 10px;border:1px solid rgba(251,146,60,.4)}
.refresh-sub{text-align:center;font-size:11px;color:#4a5a7a;margin-top:6px}
/* Warehouse view toggle + grid */
.icon-btn{background:#1a2540;border:1px solid #2a3a5c;color:#9fb3d4;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
.wh-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.wh-tile{background:#1a2540;border:1px solid #2a3a5c;border-radius:8px;padding:5px;cursor:pointer;text-align:center;position:relative;overflow:hidden}
.wh-tile.flagged{border-color:#38bdf8;background:#0d2a4a}
.wh-thumb{width:100%;aspect-ratio:1;border-radius:5px;background:#0f172a;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:4px}
.wh-thumb img{width:100%;height:100%;object-fit:contain}
.wh-thumb .img-ph{font-size:9px;color:#3a4a6c}
.wh-tile-name{font-size:9px;color:#94a3b8;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wh-tile-badge{position:absolute;top:3px;right:3px;background:#38bdf8;color:#0f172a;font-size:7px;font-weight:800;padding:1px 4px;border-radius:4px}
.detail-stat.tappable{cursor:pointer;border-color:#2a4a6c}
.detail-stat.tappable .k{color:#38bdf8}
.team-logo{width:min(88vw,460px);max-height:40vh;height:auto;margin-bottom:18px;object-fit:contain}
@keyframes cardpoof{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.5)}}
.puffing{animation:cardpoof .4s ease-in forwards;pointer-events:none}
@keyframes smokeP{0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.3)}15%{opacity:.85}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(var(--s))}}
.smoke-p{position:fixed;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,rgba(205,214,230,.72),rgba(205,214,230,0) 70%);filter:blur(4px);pointer-events:none;z-index:9999;animation:smokeP .62s ease-out forwards}
@keyframes rockOn{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}45%{transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}}
.poof-emoji{position:fixed;z-index:10000;font-size:74px;line-height:1;pointer-events:none;animation:rockOn .72s ease-out forwards}
/* Krypton (2026-07-24): portrait artwork fills the screen whole; the amber
   work-light flicker survives only on the quick "Coming Soon" splash. */
.krypton-coming{font-size:min(9vw,46px);font-weight:900;letter-spacing:.08em;color:#fbbf24;text-align:center;animation:kflicker 2.8s infinite}
@keyframes kflicker{
  0%,100%{opacity:1;text-shadow:0 0 18px rgba(251,191,36,.85),0 0 44px rgba(251,191,36,.35)}
  7%{opacity:.5}
  9%{opacity:1}
  36%{opacity:.85}
  41%{opacity:.25;text-shadow:none}
  43%{opacity:1;text-shadow:0 0 18px rgba(251,191,36,.85),0 0 44px rgba(251,191,36,.35)}
  71%{opacity:.9}
  74%{opacity:1}
}

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="offpill" class="offline-pill">⚠ Offline — changes will sync</div>
<div id="syncinfo" class="sync-overlay" onclick="hideSyncInfo()"></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
// 2.0: every value that used to be hardcoded here lives in config.js.
const CFG=window.GEO_CONFIG;
firebase.initializeApp(CFG.firebase);
const DB=firebase.database();
// Every 2.0 write is walled inside this node; the 1.0 node stays sacred.
const ROOT=CFG.rootNode;

// ── TEAMS (from config — team-to-branch mapping is the load-bearing entry) ────
const TEAMS=CFG.teams;
const isTest=()=>team==='test';

// ── DATA (loaded from the Restock Export catalog) ─────────────────────────────
// 2.0 model: one object per PLACEMENT (duplicate Part IDs expected and correct)
// plus one object per assembly component. The browsable tree is assembled at
// runtime from each object's Location Path — output order IS display order.
let OBJS=[];            // every export object, in tree-walk order
let PARTS=[];           // one merged entry per unique Part ID (search, reports)
let PMAP={};            // id -> merged part
let NODES={};           // nodeKey -> {key,parentKey,step,children:[],parts:[]}
function stepKey(s){return (s['Step Type']==='Assembly'?'A':'L')+s['Node ID'];}
function pathKey(path,len){let k='';for(let i=0;i<len;i++)k+=(i?'/':'')+stepKey(path[i]);return k;}
function mapObj(r){
  const unit=r['Locations Unit Of Measure'];
  const isEach=!unit||String(unit).toLowerCase()==='each';
  return {
    id:r['Part ID'],
    name:r['Description']||'',
    entryType:r['DB Entry Type'],       // Part / Assembly / Tool — behavior by kind
    stockType:r['Stock Type'],          // Consumable / Nonstock — flow routing
    size:r['Size'],
    cat1:r['CAT 1']||'',cat2:r['CAT 2']||'',cat3:r['CAT 3']||'',
    stockClass:r['Stock Class'],           // trailer / shop / nonstock — single-source role
    locationId:r['Location ID'],
    path:r['Location Path']||[],
    stockMin:r['Stock Min'],
    stockMax:r['Stock Max'],
    reorderQty:r['Reorder Quantity'],
    unit,isEach,
    refill:!isEach?unit:null,
    refillTo:!isEach?(r['Stock Max']!=null?String(r['Stock Max']):String(unit)):null,
    compQty:r['Component Quantity'],    // non-null only on assembly-component rows
    compUnit:r['Component Unit Description'],
    vendor:r['Vendor Name']||'',
    vendorPart:r['VEN Part Number'],
    venUrl:r['VEN URL']||'',
    venCaseQty:r['VEN Case QTY Txt']||'',
    venCaseQtyNum:r['VEN Case QTY #'],
    cost:r['Vendor Cost'],
    img:CFG.imageBase+r['Part ID']+CFG.imageExt, // the image rule: base + Part ID + ext
  };
}
// A placement is "hidden warehouse" if any non-Assembly step in its path is one of the
// suppressed warehouse sections. Path-based, so it catches any depth of shelf beneath
// the section — including shelves that don't exist yet. Stated as SUBTRACTION, never a
// whitelist: a new warehouse section shows up automatically and only disappears if its
// Location ID is added to CFG.warehouseHiddenSections. Missing key fails SAFE (hides
// nothing) rather than blanking the list.
// Hoisted function declaration on purpose — buildData below references it.
function inHiddenWarehouse(o){
  const hidden=divHidden();
  if(!hidden.length||!o||!Array.isArray(o.path))return false;
  return o.path.some(s=>s['Step Type']!=='Assembly'&&hidden.indexOf(s['Node ID'])>=0);
}
function buildData(raw){
  OBJS=raw.map(mapObj);NODES={};PMAP={};PARTS=[];
  OBJS.forEach(o=>{
    let parentKey=null;
    o.path.forEach((s,i)=>{
      const k=pathKey(o.path,i+1);
      if(!NODES[k]){
        NODES[k]={key:k,parentKey,step:s,children:[],parts:[]};
        if(parentKey)NODES[parentKey].children.push(k);
      }
      parentKey=k;
    });
    o.nodeKey=parentKey;
    if(parentKey)NODES[parentKey].parts.push(o);
  });
  // Merged per-part map. Real placements only — component rows are the same
  // physical part wearing its assembly hat, and every part has >=1 placement.
  OBJS.filter(o=>o.compQty==null).forEach(o=>{
    let m=PMAP[o.id];
    if(!m){m=PMAP[o.id]=Object.assign({},o);m.placements=[];PARTS.push(m);}
    m.placements.push(o);
    // Shop rows (a division node OR anywhere under a Warehouse subtree) carry
    // the SHOP rules; trailer rows carry trailer rules. Stock Class is the
    // single-source role (part_api.classify_location), replacing the old
    // hardcoded Location ID 1/2/3 check.
    // PER-PLACEMENT, NOT PER-PART (2026-07-26). A part is not "a warehouse part"
    // or "a trailer part" — each of its PLACEMENTS is one or the other, and each
    // carries its own honest numbers. We keep a reference to each life:
    //   shopObj    = the warehouse placement -> Stock Min + Reorder Quantity
    //   trailerObj = the trailer placement   -> Stock Min + Stock Max
    // A dual-life part has BOTH and belongs in BOTH lists, showing that
    // placement's numbers each time. Neither may suppress the other.
    if(o.stockClass==='shop'){m.shopObj=m.shopObj||o;m.shopMin=o.stockMin;m.shopOrderQty=o.reorderQty;}
    else if(o.stockClass==='trailer'){m.trailerObj=m.trailerObj||o;} // first trailer placement
    // 'nonstock' rows contribute neither — reorder-neutral as standalone parts.
  });
  // Role flags describe WHICH LIVES a part has, not one verdict about the part.
  // hasShop/hasTrailer are independent and a part may have both. The weekly
  // vendor reorder still re-collapses to one row per Part ID on purpose (that PO
  // must never list a part twice) — see reorderRows.
  PARTS.forEach(m=>{
    m.hasShop=m.placements.some(p=>p.stockClass==='shop');
    // hasShop = the FACT (this part has a warehouse placement).
    // hasShopVisible = the DISPLAY RULE (that placement is in a section we surface).
    // Keep them separate: hiding is a crew-facing view decision, never a claim that the
    // part isn't stocked in the warehouse. The reorder report keys off the shop NUMBERS,
    // not this flag, so hidden-section parts still reorder normally.
    m.hasShopVisible=m.placements.some(p=>p.stockClass==='shop'&&!inHiddenWarehouse(p));
    m.hasTrailer=m.placements.some(p=>p.stockClass==='trailer');
    // The TRAILER placement defines deploy semantics (Each vs Bin/Bag) and the
    // trailer min/max. Shop numbers live separately in shopMin/shopOrderQty, so
    // this can never clobber them.
    const o=m.trailerObj;if(o){m.isEach=o.isEach;m.unit=o.unit;m.refill=o.refill;m.refillTo=o.refillTo;m.stockMin=o.stockMin;m.stockMax=o.stockMax;}
  });
}

function subtreeParts(n,acc){acc=acc||[];n.parts.forEach(o=>{if(o.compQty==null)acc.push(o);});n.children.forEach(k=>subtreeParts(NODES[k],acc));return acc;}
// Friendly-fraction display: DB keeps honest decimals, config maps the face.
function fmtQ(v){

// TEAM-SCOPED usage read (2026-07-26 blocker fix). Each trailer is its OWN
// entity: a part pulled off Gold's trailer is Gold's refill obligation and must
// never appear on Titanium's or Cobalt's report. This reads ONLY the active
// team's usage (allUsage, already narrowed to teams/{team}/usage by the

// was the bug: writes were always correctly per-team, but the report summed

// ── DIVISION RESOLVERS (2026-07-26) ─────────────────────────────────────────
// Every team belongs to a division (CFG.divisions). A division owns its own
// trailer and its own section of the ONE physical warehouse. These resolve the
// active team's division at READ time, so a team switch re-points everything.
// All three fall back to the legacy top-level CFG keys, then to Geo, so a bad
// or missing divisions entry can never break the Geo teams.
function divCfg(){
  const key=(TEAMS[team]&&TEAMS[team].division)||'geo';
  const d=(CFG.divisions&&(CFG.divisions[key]||CFG.divisions.geo))||{};
  return d;
}
function divTiles(){const d=divCfg();return Array.isArray(d.tiles)?d.tiles:(CFG.tiles||[]);}
function divWarehouseId(){const d=divCfg();return d.warehouseLocationId!=null?d.warehouseLocationId:CFG.warehouseLocationId;}
function divHidden(){const d=divCfg();return Array.isArray(d.warehouseHiddenSections)?d.warehouseHiddenSections:(CFG.warehouseHiddenSections||[]);}
// True if this PLACEMENT lives under the active team's division. Geo teams see
// Geo's tree, Krypton sees Solar's — no cross-division bleed. Fails OPEN (true)
// if the division id is unknown, so nothing can vanish unexpectedly.
function inMyDiv(o){
  const d=divCfg().divisionLocationId;
  if(d==null||!o||!Array.isArray(o.path))return true;
  return o.path.some(s=>s['Step Type']!=='Assembly'&&s['Node ID']===d);
}

function trailerParts(){return PARTS.filter(p=>p.placements&&p.placements.some(x=>x.stockClass==='trailer'&&inMyDiv(x)));}
const tileFor=o=>{if(!o||!o.path)return null;for(const s of o.path){if(s['Step Type']!=='Assembly')for(const tl of divTiles())if(tl.locationId===s['Node ID'])return tl;}return null;};
const nodeName=o=>{const n=o&&o.nodeKey?NODES[o.nodeKey]:null;return n?n.step['Node Name']:'';};

// STOP — a trailer placement never disqualifies it. The old `&& !hasTrailer`

// Read-time scan (NOT the buildData-time hasShopVisible flag): hidden sections
// and division are both per-team, so this must re-evaluate on every team switch.
const warehouseParts=()=>PARTS.filter(p=>p.placements&&p.placements.some(x=>x.stockClass==='shop'&&!inHiddenWarehouse(x)&&inMyDiv(x)));

function queueLen(){try{return JSON.parse(localStorage.getItem('geo_wq')||'[]').length}catch(e){return 0}}
function syncIsPending(){return pendingWrites>0||queueLen()>0}
function setLastSync(){localStorage.setItem('geo_lastSync',String(Date.now()));}
function queueWrite(path,value){
  let q;try{q=JSON.parse(localStorage.getItem('geo_wq')||'[]')}catch(e){q=[]}
  q.push({path,value});localStorage.setItem('geo_wq',JSON.stringify(q));
}
function flushQueue(){
  let q;try{q=JSON.parse(localStorage.getItem('geo_wq')||'[]')}catch(e){q=[]}
  if(!q.length){updSync();return;}
  const rest=[];
  q.forEach(op=>{
    try{const ref=DB.ref(op.path);(op.value===null?ref.remove():ref.set(op.value)).then(setLastSync).catch(()=>rest.push(op));}
    catch(e){rest.push(op)}
  });
  localStorage.setItem('geo_wq',JSON.stringify(rest));
  updSync();
}
function dbWrite(path,value){
  if(!navigator.onLine)queueWrite(path,value);
  pendingWrites++;updSync();
  let pr;
  try{const ref=DB.ref(path);pr=(value===null?ref.remove():ref.set(value));}
  catch(e){pr=Promise.reject(e);}
  pr.then(()=>{pendingWrites--;setLastSync();updSync();})
    .catch(()=>{pendingWrites--;queueWrite(path,value);updSync();});
}
function updOffPill(){const e=$('offpill');if(e)e.style.display=navigator.onLine?'none':'block';}
function updSync(){const d=$('syncdot');if(d)d.className='sync-pill'+(syncIsPending()?' pending':'');updOffPill();}
window.addEventListener('online',()=>{updOffPill();flushQueue();});
window.addEventListener('offline',()=>{updOffPill();updSync();});

function timeAgo(ms){
  ms=Number(ms)||0;if(!ms)return'never';
  const s=Math.floor((Date.now()-ms)/1000);
  if(s<60)return'just now';
  const m=Math.floor(s/60);if(m<60)return m+'m ago';
  const hr=Math.floor(m/60);if(hr<24)return hr+'h ago';
  const d=Math.floor(hr/24);if(d<7)return d+'d ago';
  return new Date(ms).toLocaleDateString();
}

    // Legacy entries only ever had a single r.team string — treat that as a one-team set so old,

    const teamsObj=r.teams||(r.team?{[r.team]:true}:{});

    'body{font-family:-apple-system,Arial,sans-serif;color:#111;margin:0;padding:0 4px;}'+

function toolCrewList(){

            <div style="flex:1;min-width:0;">
              <div class="item-name" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${h(o.name)}</div>
              <div class="item-meta">${meta}</div></div>
            <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;margin-left:8px;">${right}<span class="chevron">›</span></div>
          </button>`;
        }).join('')}
        <div style="height:20px;"></div>
      </div>${popup?renderPopup():''}${whDetail?renderWhDetail():''}${toolFlag?renderToolFlag():''}`;
  }

  // REPORT
  if(scr==='report'){
    const up=loggedParts();
    const pins=pinList();
    return`
      <div class="hdr"><div class="hdr-row">
        <button class="back" onclick="goBack()">‹</button>
        <div style="flex:1;"><div class="hdr-title">Restock Report</div>
        <div class="hdr-sub"><span style="color:${t.color};">${t.icon} Team ${t.label}</span>${up.length>0?' · '+up.length+' item'+(up.length!==1?'s':'')+' needed':''}</div></div>
        ${sdot()}
      </div></div>
      <div class="scroll">
        ${pins.length?`<div class="sec-hdr" style="color:#fbbf24;">🛠 Owed to the trailer — until Received</div>
          ${pins.map(pin=>{const p=PMAP[pin.id]||{name:'Part '+pin.id};
            return`<button class="rep-row" onclick="openPinDetail(${pin.id})" style="background:#1d1a0e;">
              <div style="flex:1;min-width:0;">
                <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.entryType==='Assembly'?'🔩':'🛠'} ${h(p.name)}</div>
                <div style="font-size:11px;color:#4a5a7a;margin-top:2px;">${h(pin.name||'?')}: ${h(pin.reason||'')}${stamps[pin.id]?' · 🧾 ordered '+h(stamps[pin.id]):''}</div>
              </div><span class="chevron">›</span></button>`;}).join('')}`:''}
        ${up.length===0&&pins.length===0?`<div style="padding:56px 24px;text-align:center;">
            <div style="font-size:48px;margin-bottom:14px;">🎉</div>
            <div style="font-size:17px;font-weight:700;color:#22c55e;margin-bottom:8px;">All caught up!</div>
            <div style="font-size:13px;color:#4a5a7a;line-height:1.6;">Nothing needs restocking for Team ${h(t.label)} right now.</div></div>`:
          loggedGroups().map(cat=>`
            <div class="sec-hdr">${h(cat)}</div>
            ${up.filter(p=>repGroup(p)===cat).map(p=>{
              // This team's own pull count — never another trailer's.
              const a=myUsage(p.id);
              const target=p.isEach?('Qty '+a.total):('Refill '+h(fmtQ(p.refillTo)));
              const tl=tileFor(p.trailerObj||p);
              return`<button class="rep-row" onclick="openRepDetail(${p.id})">
                <div style="flex:1;min-width:0;">
                  <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${h(p.name)}</div>
                  <div style="font-size:11px;color:#4a5a7a;margin-top:2px;">${tl?tl.icon+' '+h(tl.label):'📦 Warehouse'} · <span style="color:#7a8fb5;font-weight:600;">${h(ti().label)}</span></div>
                </div>
                <div style="text-align:right;margin-left:8px;flex-shrink:0;display:flex;align-items:center;gap:6px;">
                  <span style="font-size:15px;font-weight:700;color:${p.isEach?'#ef4444':'#38bdf8'};">${target}</span>
                  <span class="chevron">›</span>
                </div></button>`;
            }).join('')}`).join('')}
        <div style="height:20px;"></div>
      </div>${repDetail?renderRepDetail():''}${pinDetail?renderPinDetail():''}${popup?renderPopup():''}${toolFlag?renderToolFlag():''}`;
  }

  // WEEKLY REORDER LIST (Test-only admin)
  if(scr==='shopreorder'){
    // Single shared dataset for screen/print/CSV — reorderRows() joins shopFlags + live catalog
    // (Order Qty / VEN Case QTY / VEN URL always come from the current catalog, see reorderRows()).
    const rows=reorderRows();
    return`
      <div class="hdr"><div class="hdr-row">
        <button class="back" onclick="goBack()">‹</button>
        <div style="flex:1;"><div class="hdr-title">Weekly Reorder List</div>
        <div class="hdr-sub"><span style="color:${t.color};">${t.icon} ${t.label}</span>${rows.length>0?' · '+rows.length+' item'+(rows.length!==1?'s':''):''}</div></div>
        ${sdot()}
      </div></div>
      <div class="scroll"><div style="padding:14px 18px;">
        <div style="font-size:11px;color:#4a5a7a;line-height:1.5;margin-bottom:12px;">Shop-wide reorder flags, raised by any team when an item drops below its shop minimum. Clear this after the weekly order is placed.</div>
        ${rows.length===0?`<div style="padding:48px 24px;text-align:center;">
            <div style="font-size:44px;margin-bottom:12px;">✅</div>
            <div style="font-size:16px;font-weight:700;color:#22c55e;margin-bottom:6px;">List is empty</div>
            <div style="font-size:13px;color:#4a5a7a;">Nothing is flagged for reorder right now.</div></div>`:
          rows.map(r=>`<div class="rep-row" style="cursor:default;">
              <div style="flex:1;min-width:0;">
                <div style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${(r.notes.length||r.asmSum||r.teamCount)?'<span style="color:#fbbf24;">'+(r.notes.length||r.asmSum||r.teamCount)+' ×</span> ':''}${h(r.name||('Part '+r.id))}</div>
                <div style="font-size:11px;color:#4a5a7a;margin-top:2px;">${r.vendor?h(String(r.vendor))+' · ':''}Shop min: ${(r.shopMin==null||r.shopMin==='')?'—':h(String(r.shopMin))}${r.venCaseQty?' · '+h(String(r.venCaseQty)):''}${r.teamLabel?' · by '+h(r.teamLabel):''}</div>
                ${r.notes.length?r.notes.map(n=>`<div style="font-size:11px;color:#94a3b8;margin-top:3px;">🛠 <b>${h(n.name||'?')}</b>${h(noteTag(n))}: ${h(n.reason)}</div>`).join(''):''}
              </div>
              ${r.venUrl?`<a href="${h(r.venUrl)}" target="_blank" rel="noopener" style="flex-shrink:0;margin-left:8px;font-size:11px;font-weight:700;color:#38bdf8;text-decoration:none;white-space:nowrap;" onclick="event.stopPropagation()">🔗 Web Link</a>`:''}
            </div>`).join('')}
        ${rows.length>0?`<div style="display:flex;gap:10px;margin-top:24px;">
            <button class="btn ghost" onclick="printReorder()" style="flex:1;padding:11px;font-size:13px;font-weight:700;">🖨 Print</button>
            <button class="btn ghost" onclick="exportReorderCSV()" style="flex:1;padding:11px;font-size:13px;font-weight:700;">⬇ Export CSV</button>
          </div>`:''}
        <div style="height:20px;"></div>
      </div></div>`;
  }

  // WAREHOUSE
  if(scr==='warehouse'){
    return`
      <div class="hdr"><div class="hdr-row">
        <button class="back" onclick="goBack()">‹</button>
        <div style="flex:1;min-width:0;"><div class="hdr-title">🏢 Warehouse ${grab?'Items':'Stock'}</div><div class="hdr-sub" style="color:${t.color};">${t.icon} Team ${t.label}</div></div>
        <button class="icon-btn" onclick="toggleView()" title="Toggle view">${viewIcon()}</button>
        ${sdot()}
      </div></div>
      <div class="scroll">
        <div class="wh-count"><b>${warehouseParts().length}</b> warehouse items</div>
        <div class="search-wrap">
          <div class="search-input-wrap">
            <input type="text" id="whq" value="${h(whQ)}" placeholder="Search warehouse items…" autocomplete="off" autocorrect="off" spellcheck="false" oninput="updateWh(this.value)">
            <button id="whc" class="srch-clr" onclick="clearWh()" style="display:${whQ?'flex':'none'};">✕</button>
          </div>
        </div>
        <div id="whr">${buildWhResults(whQ)}</div>
        <div style="height:20px;"></div>
      </div>${whDetail?renderWhDetail():''}${toolFlag?renderToolFlag():''}`;
  }
  return'';
}

// ── POPUP (usage) ─────────────────────────────────────────────────────────────
function toolFromPopup(){const p=popup;popup=null;openToolFlag(PMAP[p.id]||p);}
function renderPopup(){
  const p=popup;
  // Tools have no usage semantics (behavior by kind, §7.3): the team-side tap
  // goes straight to Broken/Lost → identity dialog → Carson's report with the
  // who and the why. Same gate as Part & Dart, identical for every team.
  if(p.entryType==='Tool')return`<div class="overlay" onclick="if(event.target===this){popup=null;render();}"><div class="popup">
    ${imgBlock(p)}
    <div class="pop-name">${h(p.name)}</div>
    <div class="pop-meta">🛠️ Tool · flag it if it needs replacing</div>
    <button class="btn blue" onclick="toolFromPopup()">Broken / Lost</button>
    <button class="btn ghost" style="margin-top:8px;" onclick="popup=null;render();">Cancel</button>
  </div></div>`;
  return`<div class="overlay" onclick="if(event.target===this)closePopup()"><div class="popup">
    ${imgBlock(p)}
    <div class="pop-name">${h(p.name)}</div>
    ${p.compQty!=null?`<div class="pop-meta">🔩 <span class="hl">${h(fmtQ(p.compQty))}×</span> in this assembly</div>`:''}
    ${p.isEach
      ?`<div class="pop-meta">Max: <span class="hl">${h(fmtQ(p.stockMax))}</span>${p.stockMin!=null?' · Min: <span class="hl">'+h(fmtQ(p.stockMin))+'</span>':''}</div>
        <div class="pop-lbl">Team usage:</div>
        <div class="qty-row">
          <button id="qm" class="qty-btn qty-minus${popQty===0?' off':''}" onclick="qAdj(-1)">−</button>
          <input id="qv" class="qty-input" type="number" value="${popQty}" min="0" onchange="qInput()">
          <button class="qty-btn qty-plus" onclick="qAdj(1)">+</button>
        </div>`
      :`<div class="pop-meta">${(p.stockMin!=null&&(''+p.stockMin).trim()!=='')?'Restock at: <span class="hl">'+h(fmtQ(p.stockMin))+'</span> → ':''}Refill to: <span class="hl">${h(fmtQ(p.refillTo))}</span></div>
        <div class="chk${popFlag?' on':''}" onclick="toggleFlag()">
          <div class="box">${popFlag?'✓':''}</div>
          <div class="lbl">Add to restock list<small>Refill to ${h(fmtQ(p.refillTo))}</small></div>
        </div>`}
    <button class="btn blue" onclick="closePopup()">Done</button>
  </div></div>`;
}

// ── REPORT DETAIL (trailer/cases) ─────────────────────────────────────────────
function renderRepDetail(){
  const p=repDetail;
  const a=myUsage(p.id);
  const target=(p.isEach?('Qty '+a.total):('Refill to '+h(fmtQ(p.refillTo))));
  return`<div class="overlay" onclick="if(event.target===this){repDetail=null;render();}"><div class="popup">
    ${imgBlock(p)}
    <div class="pop-name">${h(p.name)}</div>
    <div class="pop-meta">${(function(){const tl=tileFor(p.trailerObj||p);return tl?tl.icon+' '+h(tl.label):'📦 Warehouse';})()} · ${h(repGroup(p))}</div>
    <div class="chk big${repRecv?' on':''}" onclick="toggleRecv()">
      <div class="chk-top"><div class="box">${repRecv?'✓':''}</div><div class="lbl">Trailer Stock Received<small>Clears ${h(ti().label)}'s demand — other trailers keep theirs</small></div></div>
      <div class="chk-qty">${target}</div>
    </div>
    <div class="chk big${repBelow?' on':''}" onclick="toggleBelow()">
      <div class="chk-top"><div class="box">${repBelow?'✓':''}</div><div class="lbl">Below Shop Minimum<small>Flag for the weekly shop reorder</small></div></div>
      <div class="chk-qty">${p.shopMin==null||p.shopMin===''?'—':h(fmtQ(p.shopMin))}</div>
    </div>
    ${isTest()?'<div style="font-size:12px;color:#a78bfa;text-align:center;margin:2px 0 12px;">🧪 Test mode — below-min flags will not be saved</div>':''}
    <button class="btn blue" onclick="commitRepDetail()">Done</button>
  </div></div>`;
}

// ── WAREHOUSE DETAIL ──────────────────────────────────────────────────────────
function renderWhDetail(){
  const p=whDetail;
  // Tools don't do shop minimums (Mitch, go night): one checkbox — Broken/Lost —
  // and Done routes into the required identity dialog.
  const isTool=p.entryType==='Tool';
  return`<div class="overlay" onclick="if(event.target===this){whDetail=null;render();}"><div class="popup">
    ${imgBlock(p)}
    <div class="pop-name">${h(p.name)}</div>
    <div class="pop-meta">${isTool?'🛠️ Tool':''}${isTool&&p.vendor?' · ':''}${p.vendor?h(p.vendor):(isTool?'':'Warehouse item')}${(!isTool&&shopWhere(p))?' · '+h(shopWhere(p)):''}</div>
    ${isTool
      ?`<div class="chk${whRestock?' on':''}" onclick="toggleWhRestock()"><div class="box">${whRestock?'✓':''}</div><div class="lbl">Broken / Lost<small>Flag this tool for replacement</small></div></div>`
      :`<div class="detail-stat"><span class="k">Shop minimum</span><span class="v">${p.shopMin==null?'—':h(fmtQ(p.shopMin))}</span></div>
    <div class="detail-stat" style="margin-bottom:16px;"><span class="k">Reorder quantity</span><span class="v">${p.shopOrderQty==null?'—':h(fmtQ(p.shopOrderQty))}</span></div>
    <div class="chk${whRestock?' on':''}" onclick="toggleWhRestock()"><div class="box">${whRestock?'✓':''}</div><div class="lbl">Below Shop Minimum<small>Add to the weekly reorder list</small></div></div>`}
    ${isTest()?'<div style="font-size:12px;color:#a78bfa;text-align:center;margin:2px 0 12px;">🧪 Test mode — this will not be saved</div>':''}
    <button class="btn blue" onclick="commitWh()">Done</button>
  </div></div>`;
}

// ── FEEDBACK ──────────────────────────────────────────────────────────────────
function renderFeedback(){
  return`<div class="overlay" onclick="if(event.target===this)closeFeedback()"><div class="popup">
    <div class="pop-name">✉️ Feedback for Leveler Mitch</div>
    <div class="pop-meta" style="margin-bottom:10px;">Type your message. Tap Send to open your mail app — you can attach a photo there before sending.</div>
    <textarea id="fbmsg" placeholder="What's going on? (bug, wrong part, idea…)" style="width:100%;min-height:120px;box-sizing:border-box;background:#0d1526;border:1px solid #24314d;border-radius:12px;color:#e2e8f0;font-size:15px;font-family:inherit;padding:12px;resize:vertical;margin-bottom:12px;"></textarea>
    <button class="btn blue" onclick="sendFeedback()">Send</button>
    <button class="btn ghost" style="margin-top:8px;" onclick="closeFeedback()">Cancel</button>
  </div></div>`;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function boot(){
  if(!localStorage.getItem('geo_lastRefresh'))localStorage.setItem('geo_lastRefresh',String(Date.now()));
  fetch(CFG.catalogFile).then(r=>{
    if(!r.ok)throw new Error('catalog HTTP '+r.status);
    return r.json();
  }).then(env=>{
    buildData(env.Parts||[]);
    try{localStorage.setItem('geo_exportTs',env['Export Timestamp']||'');}catch(e){}
    flushQueue();
    startShop();
    if(team){scr='loading';render();startListeners();setTimeout(()=>{if(scr==='loading'){scr='nav';render();}},4000);}
    else{scr='team';render();}
    setTimeout(maybeAutoRefresh,2500);
  }).catch(e=>{
    // Honest error surface: say WHAT broke — a startup throw is not a missing
    // catalog (the dot-in-node-name bug hid behind exactly that lie, go night).
    $('app').innerHTML='<div style="height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#ef4444;font-size:14px;padding:30px;">App failed to start:<br>'+h((e&&e.message)||e)+'</div>';
  });
}

// ── LOGIN (real email/password auth — every screen in the app is gated behind this) ──
let _booted=false;
function bootOnce(){if(_booted)return;_booted=true;boot();}
function showLoginErr(msg){const e=$('loginErrMsg');if(e){e.textContent=msg;e.style.display=msg?'block':'none';}}
function doLogin(){
  const email=(($('loginEmail')||{}).value||'').trim();
  const pw=($('loginPassword')||{}).value||'';
  if(!email||!pw){showLoginErr('Enter your email and password');return;}
  showLoginErr('');
  const btn=$('loginBtn');if(btn){btn.disabled=true;btn.textContent='Signing in…';}
  firebase.auth().signInWithEmailAndPassword(email,pw).catch(()=>{
    showLoginErr('Wrong email or password');
    if(btn){btn.disabled=false;btn.textContent='Sign In';}
  });
  // on success, onAuthStateChanged below fires with a real user and proceeds into the app
}
function doSignOut(){
  if(_usageRef){_usageRef.off();_usageRef=null;}
  if(_shopRef){_shopRef.off();_shopRef=null;}
  if(_stampRef){_stampRef.off();_stampRef=null;}
  team=null;localStorage.removeItem('g_team');
  allUsage={};allTeams={};shopFlags={};stamps={};searchQ='';whQ='';popup=null;repDetail=null;whDetail=null;pinDetail=null;grab=false;fbOpen=false;
  _booted=false;
  firebase.auth().signOut();
  // onAuthStateChanged below fires with null and shows the login screen again
}
firebase.auth().onAuthStateChanged(u=>{
  // Leftover anonymous sessions from before this login layer shipped are NOT valid logins —
  // disabling Anonymous sign-in in Firebase only blocks NEW anonymous sessions, it doesn't
  // retroactively sign out ones that already existed. Reject them explicitly and force real login.
  if(u&&u.isAnonymous){firebase.auth().signOut();return;}
  if(u){bootOnce();}
  else{_booted=false;scr='login';render();}
});
setTimeout(()=>{if(!_booted&&scr!=='login'){scr='login';render();}},6000); // safety net: never leave the app stuck on a blank screen

// service worker (offline caching of app shell, JSON, and images)
if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
